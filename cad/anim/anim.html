  [23, [790, 560, 260], [250, 0, 70]], [27, [640, 330, 150], [400, 0, 50]], [30.5, [450, 530, 300], [230, 0, 110]],
  [35, [560, 420, 270], [330, 0, 100]], [40, [-60, 470, 250], [40, 0, 90]], [44.5, [-420, 520, 250], [-250, 0, 70]],
  [50, [540, 700, 380], [200, 0, 110]], [55.5, [440, 360, 220], [85, 0, 90]], [60, [360, 300, 190], [85, 0, 85]],
];
const camPos = new THREE.CatmullRomCurve3(CAM.map(c => V(...c[1])), false, 'centripetal');
const camTgt = new THREE.CatmullRomCurve3(CAM.map(c => V(...c[2])), false, 'centripetal');
const camera = new THREE.PerspectiveCamera(36, W / H, 5, 30000);
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const a = CAM[i][0], b = CAM[i + 1][0];
  let u = Math.max(0, Math.min(1, (t - a) / (b - a)));
  const s = (i + u) / (CAM.length - 1);
  camera.position.copy(camPos.getPoint(s)); camera.lookAt(camTgt.getPoint(s));
}

// ------------------------------------------------------------------ robot
const meta = await (await fetch('akora_anim.json')).json();
const bin = new Float32Array(await (await fetch('akora_anim.bin')).arrayBuffer());
const K = meta.keys.length + 2 * meta.n_links;
const robot = new THREE.Group(); robot.rotation.x = -Math.PI / 2; robot.scale.setScalar(0.1); scene.add(robot);
const nodeOf = {}; let linkInst = {};
const gltf = await new GLTFLoader().loadAsync('akora_anim.glb');
const meshes = []; gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); });
for (const m of meshes) {
  const [key] = m.name.split('__');
  m.castShadow = true; m.receiveShadow = true;
  if (m.material.transparent) { m.material.depthWrite = false; m.castShadow = false; }
  m.removeFromParent();
  if (key.startsWith('LINKTEMPLATE_')) {
    const side = key.split('_')[1];
    const im = new THREE.InstancedMesh(m.geometry, m.material, meta.n_links);
    im.castShadow = im.receiveShadow = true; im.frustumCulled = false; robot.add(im); linkInst[side] = im;
  } else {
    m.matrixAutoUpdate = false; m.matrix.identity(); robot.add(m);
    (nodeOf[key] ||= []).push(m);
  }
}
const tmpM = new THREE.Matrix4();
function setRobot(i) {
  const base = i * K * 16;
  meta.keys.forEach((key, k) => {
    tmpM.fromArray(bin, base + k * 16);
    for (const m of nodeOf[key] || []) { m.matrix.copy(tmpM); m.matrixWorldNeedsUpdate = true; }
  });
  ['L', 'R'].forEach((side, s) => {
    const im = linkInst[side]; if (!im) return;
    for (let j = 0; j < meta.n_links; j++) { tmpM.fromArray(bin, base + (meta.keys.length + s * meta.n_links + j) * 16); im.setMatrixAt(j, tmpM); }
    im.instanceMatrix.needsUpdate = true;
  });
}

// ------------------------------------------------------------------ frame
window.renderFrame = (i) => {
  const t = i / meta.fps;
  setRobot(Math.min(i, meta.frames - 1));
  wN1.offset.set(t * 0.010, t * 0.004); wN2.offset.set(-t * 0.006, t * 0.009);
  const rx = meta.root_x_mm[Math.min(i, meta.frames - 1)] / 10;
  rings.forEach((r, k) => {
    const p = ((t - 9.6 - k * 0.7) / 2.0);
    r.visible = p > 0 && p < 1 && t < 12.2;
    r.scale.setScalar(60 + p * 520); r.material.opacity = (1 - p) * 0.9; r.position.x = rx + 85;
  });
  camAt(t);
  updateRain(t, camera.position);
  updatePeople(t);
  ui(t);
  renderer.render(scene, camera);
  return true;
};
window.__ready = true;
</script></body></html>
