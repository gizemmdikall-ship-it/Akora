  human({ h: 171, jacket: 0x7a3d6e, pants: 0x3a3f46, skin: 0xe0b48c, hair: 0x8a8a86 }),
];
// common route (model-world cm): far bank -> front stair -> deck -> rear stair -> near bank -> rescue truck
const ROUTE = [[560, 0, 0], [529, 0, 0], [432, 0, 90], [-4, 0, 90], [-6, 0, 72], [-20, 0, 72], [-24, 0, 54], [-40, 0, 54],
  [-44, 0, 36], [-60, 0, 36], [-64, 0, 18], [-80, 0, 18], [-84, 0, 0], [-300, 0, 0], [-760, -150, 0]];
const WAIT = [[700, 40, 0], [690, -20, 0], [735, -70, 0], [745, 70, 0]];   // stranded at the entrance
const paths = WAIT.map((w, k) => {
  const pts = [w, ...ROUTE].map(p => V(...p));
  pts[pts.length - 1] = V(-760 - 70 * k, -150 + 60 * (k % 2), 0);
  const seg = pts.slice(1).map((p, i) => p.distanceTo(pts[i]));
  return { pts, seg, total: seg.reduce((a, b) => a + b, 0) };
});
function along(P, d) {
  d = Math.max(0, Math.min(P.total, d));
  for (let i = 0; i < P.seg.length; i++) {
    if (d <= P.seg[i]) return [P.pts[i].clone().lerp(P.pts[i + 1], d / P.seg[i]), P.pts[i + 1].clone().sub(P.pts[i])];
    d -= P.seg[i];
  }
  return [P.pts.at(-1).clone(), P.pts.at(-1).clone().sub(P.pts.at(-2))];
}
const ORDER = [1, 0, 3, 2];      // child first, helped by the rescuer
function updatePeople(t) {
  people.forEach((p, k) => {
    const P = paths[k], t0 = WIN.evac.start + 0.4 + ORDER.indexOf(k) * 1.5, spd = k === 1 ? 95 : 108;
    const d = (t - t0) * spd, [pos, dir] = along(P, d);
    p.position.copy(pos);
    const u = p.userData, walking = d > 0 && d < P.total, ph = d / (k === 1 ? 26 : 36);
    if (d <= 0) {                 // stranded: facing the robot, waving
      p.rotation.y = Math.PI;
      const wave = Math.sin(t * 5 + k * 1.3);
      u.AR.sh.rotation.x = 2.5; u.AR.sh.rotation.z = 0; u.AR.el.rotation.x = 0.4 + wave * 0.35;
      u.AL.sh.rotation.x = k % 2 ? -2.3 : 0.1; u.AL.el.rotation.x = k % 2 ? -0.3 + wave * 0.3 : 0;
      [u.L, u.R].forEach(l => { l.hip.rotation.z = 0; l.knee.rotation.z = 0; });
      return;
    }
    p.rotation.y = Math.atan2(-dir.z, dir.x);
    const climb = dir.y / Math.max(1, Math.hypot(dir.x, dir.z));
    const s = walking ? Math.sin(ph) : 0, c = walking ? Math.cos(ph) : 0;
    u.L.hip.rotation.z = 0.42 * s + 0.25 * Math.max(0, climb); u.R.hip.rotation.z = -0.42 * s + 0.25 * Math.max(0, climb);
    u.L.knee.rotation.z = -0.55 * Math.max(0, -c) - 0.2 * Math.max(0, climb); u.R.knee.rotation.z = -0.55 * Math.max(0, c) - 0.2 * Math.max(0, climb);
    u.AL.sh.rotation.x = 0; u.AR.sh.rotation.x = 0; u.AL.el.rotation.x = 0; u.AR.el.rotation.x = 0;
    u.AL.sh.rotation.z = -0.35 * s; u.AR.sh.rotation.z = 0.35 * s; u.AL.el.rotation.z = 0.35; u.AR.el.rotation.z = 0.35;
    p.position.y += walking ? Math.abs(c) * 1.6 : 0;
  });
}

// ------------------------------------------------------------------ camera (keys bound to narration steps)
const CAM = [
  ['intro', 0.0, [330, -470, 170], [660, 0, 110]], ['intro', 0.45, [250, -520, 230], [520, 0, 90]],
  ['intro', 1.0, [-250, 560, 230], [-420, 0, 70]], ['drive', 0.5, [-200, 500, 200], [-150, 0, 60]],
  ['drive', 1.0, [-120, 450, 175], [60, 0, 70]], ['scan', 0.5, [340, 480, 240], [160, 0, 50]],
  ['open', 0.05, [470, 580, 300], [150, 0, 120]], ['open', 0.5, [660, 620, 410], [180, 0, 170]],
  ['open', 1.0, [730, 630, 340], [220, 0, 110]], ['stairs', 0.6, [790, 560, 260], [260, 0, 60]],
  ['legs', 0.5, [620, 330, 140], [400, 0, 40]], ['rails', 0.6, [460, 580, 340], [230, 0, 120]],
  ['evac', 0.1, [430, -420, 240], [620, 0, 100]], ['evac', 1.0, [560, -380, 260], [380, 0, 110]],
  ['evac2', 0.3, [330, 680, 380], [170, 0, 120]], ['evac2', 0.65, [-160, 520, 260], [-60, 0, 90]],
  ['evac2', 1.0, [-480, 560, 290], [-600, 0, 90]], ['close', 0.4, [540, 700, 390], [200, 0, 110]],
  ['close', 1.0, [440, 380, 240], [85, 0, 90]], ['end', 1.0, [380, 320, 210], [85, 0, 90]],
].map(([k, f, p, q]) => [at(k, f), p, q]);
const camPos = new THREE.CatmullRomCurve3(CAM.map(c => V(...c[1])), false, 'centripetal');
const camTgt = new THREE.CatmullRomCurve3(CAM.map(c => V(...c[2])), false, 'centripetal');
const camera = new THREE.PerspectiveCamera(36, W / H, 5, 30000);
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const u = Math.max(0, Math.min(1, (t - CAM[i][0]) / (CAM[i + 1][0] - CAM[i][0])));
  const s = (i + u) / (CAM.length - 1);
  camera.position.copy(camPos.getPoint(s)); camera.lookAt(camTgt.getPoint(s));
}

// ------------------------------------------------------------------ robot
const meta = await (await fetch('akora_anim.json')).json();
const bin = new Float32Array(await (await fetch('akora_anim.bin')).arrayBuffer());
const K = meta.keys.length + 2 * meta.n_links;
const robot = new THREE.Group(); robot.rotation.x = -Math.PI / 2; robot.scale.setScalar(0.1); scene.add(robot);
const nodeOf = {}; const linkInst = {};
const gltf = await new GLTFLoader().loadAsync('akora_anim.glb');
const meshes = []; gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); });
for (const m of meshes) {
  const [key] = m.name.split('__');
  m.castShadow = true; m.receiveShadow = true;
  if (m.material.transparent) { m.material.depthWrite = false; m.castShadow = false; }
  m.removeFromParent();
  if (key.startsWith('LINKTEMPLATE_')) {
    const im = new THREE.InstancedMesh(m.geometry, m.material, meta.n_links);
    im.castShadow = im.receiveShadow = true; im.frustumCulled = false; robot.add(im); linkInst[key.split('_')[1]] = im;
  } else { m.matrixAutoUpdate = false; robot.add(m); (nodeOf[key] ||= []).push(m); }
}
const tmpM = new THREE.Matrix4();
function setRobot(i) {
  const base = i * K * 16;
  meta.keys.forEach((key, k) => { tmpM.fromArray(bin, base + k * 16);
    for (const m of nodeOf[key] || []) { m.matrix.copy(tmpM); m.matrixWorldNeedsUpdate = true; } });
  ['L', 'R'].forEach((side, s) => { const im = linkInst[side]; if (!im) return;
    for (let j = 0; j < meta.n_links; j++) { tmpM.fromArray(bin, base + (meta.keys.length + s * meta.n_links + j) * 16); im.setMatrixAt(j, tmpM); }
    im.instanceMatrix.needsUpdate = true; });
}

window.renderFrame = (i) => {
  const t = i / meta.fps, fi = Math.min(i, meta.frames - 1);
  setRobot(fi);
  wN1.offset.set(t * 0.002, -t * 0.035); foamTex.offset.set(0, -t * 0.045);     // current flows along the channel
  debris.forEach(b => { b.position.z = ((b.userData.off + t * 160) % 12000) - 6000; b.rotation.y += 0; });
  const rx = meta.root_x_mm[fi] / 10, sc = WIN.scan;
  rings.forEach((r, k) => {
    const p = (t - sc.start - 0.3 - k * 0.9) / 2.4;
    r.visible = p > 0 && p < 1 && t < sc.end; r.scale.setScalar(60 + p * 560); r.material.opacity = (1 - p) * 0.9; r.position.x = rx + 85;
  });
  camAt(t); updateRain(t, camera.position); updatePeople(t); ui(t);
  renderer.render(scene, camera);
  return true;
};
window.__ready = true;
</script></body></html>
